name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      # 依存パッケージを足したり外したりしたあと、アプリに同梱する
      # ライセンス一覧の作り直しを忘れていないか確かめる
      - name: Check OSS licenses
        run: |
          yarn licenses:generate
          git diff --exit-code src/assets/licenses.json

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --runInBand

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      # デバッグビルドはJSをバンドルせず Metro から読むため、Babel の非互換など
      # バンドル時にしか出ない破損を検出できない。リリース相当のバンドルを作って確かめる。
      # Metro のキャッシュが残っていると失敗を見逃すため、毎回作り直す。
      - name: Bundle JavaScript for release
        run: |
          yarn react-native bundle \
            --platform android \
            --dev false \
            --reset-cache \
            --entry-file index.js \
            --bundle-output "${RUNNER_TEMP}/index.android.bundle" \
            --assets-dest "${RUNNER_TEMP}/assets"
