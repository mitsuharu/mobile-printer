name: Publish

on:
  # 確認用のビルドや、タグを打たずに配布したいときに手で実行する
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release を作るタグ名（空ならDeployGateへの配布のみ）'
        required: false
        type: string
      prerelease:
        description: 'プレリリース（確認用のベータ版）として公開する'
        required: false
        type: boolean
        default: false

  # タグを打つとリリースする。末尾に -beta.1 などが付いたタグはプレリリースになる
  push:
    tags:
      - '*'

permissions:
  contents: write

# 同じタグや手動実行が重なったときに、後から始めたものだけを走らせる
concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest

    env:
      # タグを打った場合はそのタグ、手動実行では入力されたタグ（空になり得る）
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
      # 基本はリリース。手動実行で選んだとき、またはタグに接尾辞が付くときだけプレリリース
      IS_PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run typecheck and lint
        run: |
          yarn typecheck
          yarn lint

      # 時間関連のテスト向けにタイムゾーンを固定する
      - name: Set timezone to Asia/Tokyo
        run: sudo timedatectl set-timezone Asia/Tokyo

      - name: Run test
        run: |
          yarn test

      - name: Cache Gradle files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      # Android 側の lint と test は整備していない。
      # android/app/src にテストのソースがなく、lint も未整理の指摘が残るため、
      # 有効にするなら指摘の棚卸しから始める

      # 製品版ではないため、リリースビルドもコミット済みの debug キーストアで署名する
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      # タグを打たない手動実行でも、成果物を取り出せるようにする
      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release APK to GitHub Releases
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to DeployGate
        env:
          DEPLOYGATE_API_KEY: ${{ secrets.DEPLOYGATE_API_KEY }}
          DEPLOYGATE_USER: ${{ secrets.DEPLOYGATE_USER }}
        run: |
          if [ -z "${DEPLOYGATE_API_KEY}" ] || [ -z "${DEPLOYGATE_USER}" ]; then
            echo "DeployGate の設定がないため、アップロードを飛ばします"
            exit 0
          fi

          if [ "${IS_PRERELEASE}" = "true" ]; then
            kind="beta"
          else
            kind="release"
          fi
          message="${kind} ${RELEASE_TAG:-${GITHUB_REF_NAME}} (${GITHUB_SHA})"

          # HTTP エラーでも curl は成功で終わるため、--fail で失敗させる
          curl --fail-with-body \
            -H "Authorization: token ${DEPLOYGATE_API_KEY}" \
            -F "file=@android/app/build/outputs/apk/release/app-release.apk" \
            -F "message=${message}" \
            "https://deploygate.com/api/users/${DEPLOYGATE_USER}/apps"
