name: Publish

on:
  # 確認用のビルドや、タグを打たずに配布したいときに手で実行する
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release を作るタグ名（空ならReleaseを作らない）'
        required: false
        type: string
      prerelease:
        description: 'プレリリース（確認用のベータ版）として公開する'
        required: false
        type: boolean
        default: false
      upload_to_deploygate:
        description: 'DeployGateへ配布する（外すとワークフローの動作確認だけになる）'
        required: false
        type: boolean
        default: true

  # タグを打つとリリースする。末尾に -beta.1 などが付いたタグはプレリリースになる
  push:
    tags:
      - '*'

permissions:
  contents: write

# 同じタグや手動実行が重なったときに、後から始めたものだけを走らせる
concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    # 固まったときにGitHubのジョブ上限（6時間）まで走らせない。
    # 落ちるとログが残らず原因を追えないため、早めに打ち切る。
    # CIのassembleDebugが約21分、releaseはそれより重いので倍を見込む。
    timeout-minutes: 60

    env:
      # タグを打った場合はそのタグ、手動実行では入力されたタグ（空になり得る）
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
      # 基本はリリース。手動実行で選んだとき、またはタグに接尾辞が付くときだけプレリリース
      IS_PRERELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) || (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      # ci.yml の Build Android と同じ構成にする。あちらは Complete job まで
      # 到達するが、publish は一度も到達していない。違いはGradleの起動方法だった。
      # このアクションは後処理でデーモンを止め、Gradleの実行環境を整える。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Run typecheck and lint
        run: |
          yarn typecheck
          yarn lint

      # 時間関連のテスト向けにタイムゾーンを固定する。
      # sudo timedatectl でシステムの時刻設定を書き換えていたが、ci.yml と同じく
      # 環境変数で渡す。テストへの効果は同じで、ランナーのシステムを触らない。
      - name: Run test
        env:
          TZ: Asia/Tokyo
        run: |
          yarn test

      # Gradleのキャッシュは持たない。run 34315640308 では復元が6秒で終わり、
      # ビルドは 735 actionable tasks: 735 executed とすべて実行された。
      # つまり再利用はゼロだった。それでいて後処理の保存には10分以上かかり、
      # ビルドが終わってからジョブが終わらない原因になっていた。
      # publish は手動実行で頻度が低く、キャッシュの恩恵がないため外す。

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      # Android 側の lint と test は整備していない。
      # android/app/src にテストのソースがなく、lint も未整理の指摘が残るため、
      # 有効にするなら指摘の棚卸しから始める

      # 製品版ではないため、リリースビルドもコミット済みの debug キーストアで署名する

      # publish は8回すべてでランナーとの通信が切れている
      # （The hosted runner lost communication with the server）。
      # 落ちるとジョブのログが保存されず、後から原因を追えない。
      #
      # 資源の枯渇は計測で否定した。run 34325396782 の死ぬ直前の値は
      # メモリ空き11.4GB、スワップ使用0MB、ディスク空き83GB、load 4.36 で、
      # どれも逼迫していない。ディスクを空ける・スワップを足す対処は
      # 効いていなかったため外した。
      #
      # 一方 ci.yml の Build Android は同じ ubuntu-latest で完走し続けている。
      # 差分を洗ったところ、publish にだけ sudo でシステムを変更する操作が
      # あった（timedatectl によるタイムゾーン変更）。これは publish.yml の
      # 追加時からあり、失敗した8回すべてに存在する。ci.yml に sudo は無い。
      # ランナーのエージェントは短命なトークンで通信を維持しているため、
      # 時刻まわりを触ると接続が壊れ得る。死ぬまでの時間が4.5分から48分まで
      # ばらつくのも、周期的な処理が来たときに初めて破綻するなら説明がつく。
      #
      # 機序は未証明。ci.yml に揃えて sudo を無くし、様子を見る。

      # 配布先のSUNMI端末はARMのため、エミュレータ用のx86とx86_64は作らない。
      # android/gradle.properties は開発用にABIを4つ残したままにしてある。
      #
      # 5秒ごとに資源の残量とメモリ上位のプロセスを標準出力へ出す。ジョブの
      # ログは保存されないが、UIのライブログは落ちる直前まで見えるため、
      # 次に落ちたときはその末尾が唯一の手掛かりになる。
      # 15秒間隔では急な確保を取りこぼすため、5秒まで詰めている。
      #
      # デーモンの後始末は上の Setup Gradle に任せる。--no-daemon を試したが、
      # run 34322694091 では BUILD SUCCESSFUL とアーティファクトのアップロードが
      # 済んだあともジョブが終わらず、効果がなかった。ci.yml も付けていない。
      - name: Build Release APK
        run: |
          # 計測が失敗してもビルドを止めない。サブシェルで set +e にして、
          # 個々のコマンドが転んでもループ自体は回り続けるようにする。
          (
            set +e
            while true; do
              echo "[resources] $(date -u +%H:%M:%S)" \
                "mem_avail=$(free -m | awk '/^Mem:/{print $7}')MB" \
                "swap_used=$(free -m | awk '/^Swap:/{print $3}')MB" \
                "disk_avail=$(df -m --output=avail / | tail -1 | tr -d ' ')MB" \
                "load=$(cut -d' ' -f1-3 /proc/loadavg)" \
                "top=$(ps -eo rss,comm --sort=-rss --no-headers \
                       | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}')"
              sleep 5
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT

          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      # タグを打たない手動実行でも、成果物を取り出せるようにする
      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release APK to GitHub Releases
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/release/app-release.apk

      # 動作確認のための実行では配布を外せるようにする。タグを打った実行では
      # inputs が無いため、左の条件だけで真になり、これまでどおり配布する。
      - name: Upload to DeployGate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_deploygate }}
        env:
          DEPLOYGATE_API_KEY: ${{ secrets.DEPLOYGATE_API_KEY }}
          DEPLOYGATE_USER: ${{ secrets.DEPLOYGATE_USER }}
        run: |
          if [ -z "${DEPLOYGATE_API_KEY}" ] || [ -z "${DEPLOYGATE_USER}" ]; then
            echo "DeployGate の設定がないため、アップロードを飛ばします"
            exit 0
          fi

          if [ "${IS_PRERELEASE}" = "true" ]; then
            kind="beta"
          else
            kind="release"
          fi
          message="${kind} ${RELEASE_TAG:-${GITHUB_REF_NAME}} (${GITHUB_SHA})"

          # HTTP エラーでも curl は成功で終わるため、--fail で失敗させる
          curl --fail-with-body \
            -H "Authorization: token ${DEPLOYGATE_API_KEY}" \
            -F "file=@android/app/build/outputs/apk/release/app-release.apk" \
            -F "message=${message}" \
            "https://deploygate.com/api/users/${DEPLOYGATE_USER}/apps"
